- name: PFTValidatedLedgerOld fires
  interval: 1m
  input_series:
  - series: pft_validated_ledger_age_seconds{job="postfiat", instance="node:9877"}
    values: 120x5
  alert_rule_test:
  - eval_time: 3m
    alertname: PFTValidatedLedgerOld
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        severity: warning
      exp_annotations:
        summary: Newest validated ledger older than 60s on node:9877
        description: Ledgers normally validate every 3-5s; an age above 60s for 2m means the node is behind or the network
          is stalled.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alerts/README.md#pftvalidatedledgerold
- name: PFTValidatedLedgerOld stays quiet
  interval: 1m
