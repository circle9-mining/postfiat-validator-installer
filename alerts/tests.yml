  alert_rule_test:
  - eval_time: 3m
    alertname: PFTValidatedLedgerOld
    exp_alerts: []
- name: PFTValidatedLedgerStalled fires
  interval: 1m
  input_series:
  - series: pft_validated_ledger_seq{job="postfiat", instance="node:9877"}
    values: 100x10
  - series: pft_up{job="postfiat", instance="node:9877"}
    values: 1x10
  alert_rule_test:
  - eval_time: 7m
    alertname: PFTValidatedLedgerStalled
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        severity: critical
      exp_annotations:
        summary: Validated ledger sequence not advancing on node:9877
        description: RPC answers but validated_ledger.seq has not changed for 5m+.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alerts/README.md#pftvalidatedledgerstalled
- name: PFTValidatedLedgerStalled stays quiet
  interval: 1m
  input_series:
  - series: pft_validated_ledger_seq{job="postfiat", instance="node:9877"}
    values: 100+12x10
  - series: pft_up{job="postfiat", instance="node:9877"}
    values: 1x10
  alert_rule_test:
  - eval_time: 7m
    alertname: PFTValidatedLedgerStalled
    exp_alerts: []
- name: PFTCompleteLedgersGap fires
  interval: 1m
  input_series:
  - series: pft_complete_ledgers_ranges{job="postfiat", instance="node:9877"}
    values: 2x40
  alert_rule_test:
  - eval_time: 31m
    alertname: PFTCompleteLedgersGap
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        severity: warning
      exp_annotations:
        summary: complete_ledgers has gaps on node:9877
        description: complete_ledgers has been split into more than one range for 30m; history is missing and is not being
          backfilled.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alerts/README.md#pftcompleteledgersgap
- name: PFTCompleteLedgersGap stays quiet
