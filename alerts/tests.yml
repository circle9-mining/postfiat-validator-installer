- name: PFTLowPeers fires
  interval: 1m
  input_series:
  - series: pft_peers{job="postfiat", instance="node:9877"}
    values: 3x12
  alert_rule_test:
  - eval_time: 11m
    alertname: PFTLowPeers
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        severity: warning
      exp_annotations:
        summary: postfiatd has fewer than 5 peers on node:9877
        description: Peer count between 1 and 4 for 10m; one more disconnect could isolate the node.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alerts/README.md#pftlowpeers
- name: PFTLowPeers stays quiet
  interval: 1m
  input_series:
  - series: pft_peers{job="postfiat", instance="node:9877"}
