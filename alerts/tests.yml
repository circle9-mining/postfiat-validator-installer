# GENERATED by gen_tests.py - one firing and one non-firing case per alert.
# Run: promtool test rules tests.yml
rule_files:
- postfiat.rules.yml
evaluation_interval: 1m
tests:
- name: PFTExporterDown fires
  interval: 1m
  input_series:
  - series: up{job="postfiat", instance="node:9877"}
    values: '0x5'
  alert_rule_test:
  - eval_time: 3m
    alertname: PFTExporterDown
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        severity: critical
      exp_annotations:
        summary: Post Fiat exporter scrape failing on node:9877
        description: Prometheus cannot scrape pft-exporter; no node metrics are being collected.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alerts/README.md#pftexporterdown
- name: PFTExporterDown stays quiet
  interval: 1m
  input_series:
  - series: up{job="postfiat", instance="node:9877"}
    values: 0 0 0 1 1 1
  alert_rule_test:
  - eval_time: 3m
    alertname: PFTExporterDown
    exp_alerts: []
- name: PFTNodeRPCDown fires
  interval: 1m
  input_series:
  - series: pft_up{job="postfiat", instance="node:9877"}
    values: '0x3'
  alert_rule_test:
  - eval_time: 2m
    alertname: PFTNodeRPCDown
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        severity: critical
      exp_annotations:
        summary: postfiatd not answering server_info on node:9877
        description: The exporter is up but the node admin RPC is unreachable (container stopped, crashed or starting).
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alerts/README.md#pftnoderpcdown
- name: PFTNodeRPCDown stays quiet
  interval: 1m
  input_series:
  - series: pft_up{job="postfiat", instance="node:9877"}
    values: 1x3
  alert_rule_test:
  - eval_time: 2m
    alertname: PFTNodeRPCDown
    exp_alerts: []
- name: PFTNodeNotFull fires
  interval: 1m
  input_series:
  - series: pft_server_state{state="syncing", job="postfiat", instance="node:9877"}
    values: 2x10
  alert_rule_test:
  - eval_time: 6m
    alertname: PFTNodeNotFull
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        severity: warning
      exp_annotations:
        summary: postfiatd server_state below full on node:9877
        description: server_state has been disconnected/connected/syncing/tracking for 5m; the node is not following the validated
          chain.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alerts/README.md#pftnodenotfull
- name: PFTNodeNotFull stays quiet
  interval: 1m
  input_series:
  - series: pft_server_state{state="full", job="postfiat", instance="node:9877"}
    values: 4x10
  alert_rule_test:
  - eval_time: 6m
    alertname: PFTNodeNotFull
    exp_alerts: []
- name: PFTValidatorNotProposing fires
  interval: 1m
  input_series:
  - series: pft_server_state{state="full", job="postfiat", instance="node:9877"}
    values: 4x15
  - series: pft_validator_configured{job="postfiat", instance="node:9877"}
    values: 1x15
  alert_rule_test:
  - eval_time: 11m
    alertname: PFTValidatorNotProposing
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        severity: critical
      exp_annotations:
        summary: Validator key loaded but node not proposing on node:9877
        description: A validator token is configured but server_state has not been proposing for 10m.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alerts/README.md#pftvalidatornotproposing
- name: PFTValidatorNotProposing stays quiet
  interval: 1m
  input_series:
  - series: pft_server_state{state="full", job="postfiat", instance="node:9877"}
    values: 4x15
  - series: pft_validator_configured{job="postfiat", instance="node:9877"}
    values: '0x15'
  alert_rule_test:
  - eval_time: 11m
    alertname: PFTValidatorNotProposing
    exp_alerts: []
- name: PFTNoPeers fires
  interval: 1m
  input_series:
  - series: pft_peers{job="postfiat", instance="node:9877"}
    values: '0x5'
  alert_rule_test:
  - eval_time: 3m
    alertname: PFTNoPeers
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        severity: critical
      exp_annotations:
        summary: postfiatd has no peers on node:9877
        description: Zero connected peers for 2m; the node is isolated from the network.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alerts/README.md#pftnopeers
- name: PFTNoPeers stays quiet
  interval: 1m
  input_series:
