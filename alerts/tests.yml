        job: postfiat
        instance: node:9877
        severity: warning
      exp_annotations:
        summary: postfiatd restarted in the last 15m on node:9877
        description: 'server_info uptime went backwards: the process or its container restarted.'
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alerts/README.md#pftcontainerrestarted
